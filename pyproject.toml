[project]
name = "quartercall"
version = "0.0.1"
description = "Read QuarterCall Data, the NCUA Form 5300 Call Reports republished at data.quartercall.com, into pandas"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "QuarterCall Holdings Inc." }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]
keywords = ["credit union", "NCUA", "call report", "5300", "pandas"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://quartercall.com/"
# GitHub links to this repository show as verified on PyPI: releases come from it by trusted publishing.
Source = "https://github.com/QuarterCall/quartercall-python"
Issues = "https://github.com/QuarterCall/quartercall-python/issues"
Changelog = "https://github.com/QuarterCall/quartercall-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quartercall"]

# Hatch does not read .spikes/.gitignore, so the sdist names what it carries.
[tool.hatch.build.targets.sdist]
include = ["/src/quartercall", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv run --python ${{ matrix.python }} pytest -q
      # The oldest pandas and PyArrow the package claims to support.
      - if: matrix.python == '3.11'
        run: uv run --isolated --python 3.11 --resolution lowest-direct pytest -q
